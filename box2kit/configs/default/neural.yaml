### Model configuration
tempo: 90 # Tempo of recorded performances [bpm]
subdiv: 8 # Data point segmenents per whole-note in recording

### Training routine
epochs: 10000 # Maximum number of training epochs
batch_size: 16 # Number of data points per mini-batch
lr: 1.e-4 # Optimizer learning rates
warmup: 5000 # Length of "warmup phase" in epochs, i.e. how long before the discriminator is initialized. For training with no discriminator, use warmup > epochs.
es_delay: 6500 # How many epochs to wait before early-stopping condition is activated, if validation data is used
beta: 1 # Set importance of LSD in generator cost function (max value, annealed over training)
phi: 0.01 # Set importance of adversarial loss in generator cost function

### Output
logs: "neural_logs" # Relative path to waveform encoder checkpoints in model folder
test_freq: 100 # How often (in epochs) to generate test output, if test file is used 